org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP = true
org.eclipse.ui.intro.universal/INTRO_ROOT_PAGES = overview,tutorials,firststeps,whatsnew
org.eclipse.ui.intro/INTRO_THEME = org.eclipse.ui.intro.universal.circles
org.eclipse.ui/defaultPerspectiveId = org.mwc.debrief.core.Perspective
org.eclipse.ui/DOCK_PERSPECTIVE_BAR=TOP_RIGHT
org.eclipse.ui.intro.universal/INTRO_DATA=product:introData.xml
# Eclipse (since 2023) offers, on Windows, to add a Microsoft Defender exclusion
# for the application at first start. Debrief does not need one, and a
# security-tool prompt alarms users and their IT departments.
org.eclipse.ui.workbench/windows.defender.startup.check.skip=true

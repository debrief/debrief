# Posts the "Debrief CI" build artifacts back to the pull request that produced
# them, as a single comment that is updated in place on every push.
#
# This is deliberately a separate, workflow_run-triggered workflow. A
# `pull_request` run from a fork gets a read-only GITHUB_TOKEN and cannot
# comment. A `workflow_run` workflow always executes the copy of this file on
# the base branch - never the pull request's copy - so it can hold write
# permissions safely. It never checks out or executes pull request code.
#
# `pull_request_target` would be the wrong tool here: it grants a read-write
# token and secret access while building attacker-supplied code, and any PR to
# this repository can add an arbitrary maven-antrun-plugin execution to any of
# the ~45 poms.

name: PR build comment

on:
  workflow_run:
    workflows: ["Debrief CI"]
    types: [completed]

permissions:
  actions: read          # list and download artifacts from the triggering run
  pull-requests: write   # post / update the comment
  contents: read

concurrency:
  group: pr-build-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    # A cancelled run has nothing to report: the concurrency group in main.yml
    # kills the older run when a newer push supersedes it, and that newer run
    # posts its own result. Skipping the whole job also skips the artifact
    # download.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      # Tolerated failure: the build job is skipped on documentation-only pull
      # requests, so there is no metadata to download. Nothing to say in that
      # case, so exit quietly rather than leaving a red run in the Actions tab.
      - name: Download PR metadata
        id: meta
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-meta
          path: pr-meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the review-builds comment
        if: steps.meta.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- debrief-review-builds -->';
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // meta.env is written by a job that ran untrusted pull request code
            // (a fork's poms execute on that runner before the file is written),
            // so nothing in it is trusted. Its `pr` value is used only as one more
            // candidate to look up; every candidate must be confirmed against the
            // triggering run itself before anything is written.
            let meta = {};
            try {
              meta = Object.fromEntries(
                fs.readFileSync('pr-meta/meta.env', 'utf8')
                  .split('\n')
                  .filter(Boolean)
                  .map(line => {
                    const i = line.indexOf('=');
                    return [line.slice(0, i), line.slice(i + 1)];
                  })
              );
            } catch (e) {
              core.info(`Ignoring unreadable pr-meta: ${e.message}`);
            }

            // Resolve the pull request from the workflow_run event, which GitHub
            // populates and the pull request cannot influence. pull_requests is
            // empty for fork PRs, so fall back to the commit and head-branch
            // lookups.
            const headSha = run.head_sha;
            const headRepo = run.head_repository ? run.head_repository.full_name : null;
            const candidates = new Set();
            for (const p of run.pull_requests || []) candidates.add(p.number);
            const hinted = Number(meta.pr);
            if (Number.isInteger(hinted) && hinted > 0) candidates.add(hinted);
            try {
              const { data: assoc } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: headSha, per_page: 100,
              });
              for (const p of assoc) candidates.add(p.number);
            } catch (e) {
              core.info(`listPullRequestsAssociatedWithCommit failed: ${e.message}`);
            }
            if (run.head_repository && run.head_branch) {
              const { data: byHead } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100,
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
              });
              for (const p of byHead) candidates.add(p.number);
            }

            // Only an open pull request into this repository whose head is
            // exactly the commit this run built, from the same head repository,
            // qualifies.
            const prNumbers = [];
            for (const n of candidates) {
              let pull;
              try {
                ({ data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: n }));
              } catch (e) {
                core.info(`PR #${n}: lookup failed (${e.message}); skipping.`);
                continue;
              }
              const ok = pull.state === 'open'
                && pull.head && pull.head.sha === headSha
                && pull.base && pull.base.repo && pull.base.repo.full_name === `${owner}/${repo}`
                && (!headRepo || (pull.head.repo && pull.head.repo.full_name === headRepo));
              if (ok) {
                prNumbers.push(pull.number);
              } else {
                core.info(`PR #${n} does not match run ${run.id} (head ${headSha}); skipping.`);
              }
            }
            if (prNumbers.length === 0) {
              // Typically a newer push has moved the PR head on; that run posts
              // its own result.
              core.info(`No open pull request has head ${headSha}; nothing to comment on.`);
              return;
            }
            const sha = headSha.slice(0, 7);

            // The build result comes from the run itself, not from meta.env.
            // A cancelled build has not failed - the concurrency group killed it
            // because a newer push superseded it. Saying "the build failed" would
            // be wrong, and would replace a good comment with a red one until the
            // newer run catches up. Leave the comment alone. (The job-level `if`
            // already skips cancelled runs; this is belt and braces.)
            if (run.conclusion === 'cancelled') {
              core.info('Build was cancelled (superseded); leaving the comment as it is.');
              return;
            }

            const built = run.conclusion === 'success';

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id, per_page: 100,
            });

            const row = (prefix, notes) => {
              const a = data.artifacts.find(x => x.name.startsWith(prefix) && !x.expired);
              if (!a) return null;
              const mb = Math.round(a.size_in_bytes / 1048576);
              return `| ${notes.platform} | [Download](${run.html_url}/artifacts/${a.id}) (${mb} MB) | ${notes.note} |`;
            };

            const rows = [
              row('DebriefNG-Windows-x64', {
                platform: 'Windows x64',
                note: 'Java 11 bundled — unzip and run `DebriefNG.exe`',
              }),
              row('DebriefNG-macOS-x64', {
                platform: 'macOS x64',
                note: '**Requires Java 11 on the PATH**; Intel build, runs under Rosetta 2',
              }),
              row('DebriefNG-Linux-x64', {
                platform: 'Linux x64',
                note: '**Requires Java 11 on the PATH**',
              }),
            ].filter(Boolean);

            let body;
            if (rows.length === 0) {
              body = [
                MARKER,
                '## Review builds',
                '',
                built
                  ? `No installers were produced for \`${sha}\`. See [run #${run.run_number}](${run.html_url}).`
                  : `:x: The build of \`${sha}\` failed, so no installers were produced. See [run #${run.run_number}](${run.html_url}) for the logs.`,
              ].join('\n');
            } else {
              const warning = built
                ? ''
                : '\n> :warning: The build of this commit **failed**. The downloads below were produced before the failure and may not reflect the whole change — check [run #' + run.run_number + '](' + run.html_url + ').\n';
              body = [
                MARKER,
                '## Review builds',
                '',
                `Built from \`${sha}\` — [run #${run.run_number}](${run.html_url})`,
                warning,
                '| Platform | Download | Notes |',
                '|---|---|---|',
                ...rows,
                '',
                '<details><summary>How to download and run</summary>',
                '',
                'Downloading requires a signed-in GitHub account — GitHub serves workflow',
                'artifacts only to authenticated users. Each download is the platform zip',
                'itself - unzip it once.',
                '',
                '**macOS** — the app is not signed or notarised, so Gatekeeper will refuse to',
                'open it. After unzipping:',
                '',
                '```bash',
                'xattr -dr com.apple.quarantine DebriefNG.app',
                'open DebriefNG.app',
                '```',
                '',
                '**Windows** — the executable is not code-signed. SmartScreen will show',
                '"Windows protected your PC": choose **More info**, then **Run anyway**.',
                '',
                '**Linux** — run `chmod +x DebriefNG` if the executable bit did not survive',
                'the round trip.',
                '',
                'These are throwaway review builds and are deleted after 14 days. Please do',
                'not redistribute them.',
                '</details>',
              ].join('\n');
            }

            body += `\n\n---\n_Posted by \`.github/workflows/pr-build-comment.yml\` · run #${run.run_number}_`;

            // Sticky comment: update in place rather than posting one per push.
            for (const prNumber of prNumbers) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find(
                c => c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.includes(MARKER)
              );

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            }

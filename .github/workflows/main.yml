# This is a workflow for debrief for continuous integration
#
# On a pull request it builds the Windows / macOS / Linux products and attaches
# them to the run as artifacts, so reviewers can download and run the change.
# The companion workflow .github/workflows/pr-build-comment.yml posts the
# download links back to the pull request.

name: Debrief CI

on:
  push:
    branches:
      - develop
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

# One build per PR: a new push cancels the superseded run. Never cancel a
# push/tag build, which may be publishing a release.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Decide whether this PR contains software changes. A docs-only PR does not
  # need a 40-minute Tycho build. Note this is a job-level gate rather than a
  # top-level `paths-ignore:` - a job skipped by `if:` reports as "skipped",
  # which satisfies a required status check, whereas a workflow skipped by a
  # path filter reports nothing at all and sits pending forever.
  changes:
    name: Detect software changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Empty (non-PR events) falls back to 'true' so push/tag builds always run.
      software: ${{ steps.filter.outputs.software || 'true' }}
    steps:
      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            // True as soon as the diff contains one file that is not
            // documentation. Note .github/** is deliberately NOT treated as
            // documentation - a change to CI itself should build.
            const DOCS = [
              /\.md$/,
              /^docs\//,
              /^specs\//,
              /^\.specify\//,
              /^\.claude\//,
              /^LICENSE\.txt$/,
              /(^|\/)\.gitignore$/,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Fail safe towards building: an empty or truncated file list
            // (the API caps out at 3000 files) must not skip a real change.
            const software =
              files.length === 0 || files.some(f => !DOCS.some(re => re.test(f.filename)));
            core.info(`${files.length} changed file(s); software=${software}`);
            core.setOutput('software', String(software));

  buildandrelease:
    name: Build and release Debrief
    needs: changes
    if: needs.changes.outputs.software == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the tag build publishes a GitHub release
    steps:
      # apt is retried because a mirror 503 can otherwise destroy a build
      # outright. Acquire::Retries covers fetches within a single apt
      # invocation; the loop covers the whole command. Failure after the
      # retries is loud.
      - name: Install build and test dependencies
        run: |
          retry() {
            local n
            for n in 1 2 3; do
              "$@" && return 0
              echo "::warning::[attempt ${n}/3] failed: $*"
              sleep 15
            done
            echo "::error::failed after 3 attempts: $*"
            return 1
          }
          APT="sudo apt-get -y -o Acquire::Retries=3"

          retry $APT update
          retry $APT install unzip xvfb
          mvn --version
      # Checks-out repository
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Tycho 5 needs JDK 21, and Java 21 is also Debrief's runtime.
          java-version: '21'

      # The build uses the Maven wrapper's pinned version (.mvn/wrapper), not
      # the runner image's Maven, which changes without notice: 3.10.1 could not
      # resolve tycho-maven-plugin or EMF's version range from Central.
      # The first ./mvnw call downloads the pinned Maven from Central; the
      # wrapper does not retry, so a network blip would fail the whole job
      # Keep the pinned Maven itself, so most jobs don't download it at all
      - name: Cache the pinned Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-dist-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Fetch the pinned Maven
        run: |
          # Central's outages last a minute or two: back off 15, 30, 45, 60 s
          for n in 1 2 3 4 5; do
            ./mvnw --version && exit 0
            echo "::warning::[attempt ${n}/5] the Maven wrapper could not fetch Maven"
            [ "$n" = 5 ] || sleep $((15 * n))
          done
          echo "::error::the Maven wrapper could not fetch Maven after 5 attempts"
          exit 1

      # Tycho otherwise re-resolves the whole Eclipse target platform from
      # remote P2 sites on every run. Restore only: Actions caches are
      # branch-scoped under a 10GB repo-wide LRU limit, so a multi-GB cache
      # written by every PR branch would evict itself. The single writer is the
      # `develop` push below, and every PR restores from that.
      # The key covers the target definition as well as the poms, because
      # changing eclipse-latest.target is what actually invalidates P2 resolution.
      - name: Restore Maven / Tycho cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.p2
          key: m2-tycho-${{ hashFiles('org.mwc.debrief.targetplatforms/eclipse-latest.target', '**/pom.xml') }}
          restore-keys: |
            m2-tycho-

      - name: Cache Windows JRE
        id: win-jre
        uses: actions/cache@v6
        with:
          path: ~/.cache/debrief-win-jre
          key: win-jre-21.0.13-9

      # The JRE is bundled into the shipped Windows zip and MSI, so it is pinned
      # to the SHA-256 published alongside the release
      # (OpenJDK21U-jre_x64_windows_hotspot_21.0.13_9.zip.sha256.txt) and the
      # job fails on a mismatch. Keep WIN_JRE_SHA256 in step with
      # contribs/msi/make_x64msi.sh.
      - name: Download Windows JRE
        if: steps.win-jre.outputs.cache-hit != 'true'
        env:
          WIN_JRE_SHA256: 2332c0b4cff6bed722da3567c91d5e47568bcba863fa4945d0a8d6fc76158628
        run: |
          mkdir -p ~/.cache/debrief-win-jre
          curl -fsSL --retry 3 -o /tmp/win-jre.zip \
            https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jre_x64_windows_hotspot_21.0.13_9.zip
          echo "${WIN_JRE_SHA256}  /tmp/win-jre.zip" | sha256sum -c -
          mv /tmp/win-jre.zip ~/.cache/debrief-win-jre/win-jre.zip

      # Bundle the Windows JRE into the product, so the Windows build runs
      # without a separate Java install. (macOS and Linux products still
      # require Java 21 on the PATH - see the PR comment workflow.)
      # The checksum is checked again here so a restored cache is verified too.
      - name: Stage Windows JRE into the product feature
        env:
          WIN_JRE_SHA256: 2332c0b4cff6bed722da3567c91d5e47568bcba863fa4945d0a8d6fc76158628
        run: |
          echo "${WIN_JRE_SHA256}  ${HOME}/.cache/debrief-win-jre/win-jre.zip" | sha256sum -c -
          echo "root.win32.win32.x86_64 = win-64" >> org.mwc.debrief.combined.feature/build.properties
          rm -rf dest && mkdir -p dest
          unzip -q ~/.cache/debrief-win-jre/win-jre.zip -d dest
          mv dest/*-jre dest/jre
          mkdir -p org.mwc.debrief.combined.feature/win-64
          mv dest/jre org.mwc.debrief.combined.feature/win-64/jre

      # `verify` (not `package`) is required: the antrun execution in
      # org.mwc.debrief.product/pom.xml that renames the Tycho output zips to
      # DebriefNG-{Linux,Windows,MacOSX}64Bit.zip is bound to the verify phase.
      - name: run build with test
        id: build
        uses: GabrielBB/xvfb-action@v1
        with:
              working-directory: ./
              run: ./mvnw clean verify -U -B -fae

      # org.mwc.cmap.geotools's manifest lists the GeoTools jars that
      # org.mwc.cmap.geotools.libs fetches: after the build has fetched them, fail if a version bump changed
      # the jars without regenerating it
      - name: Check the GeoTools manifest
        run: python3 .github/scripts/geotools_manifest.py --check

      - name: Upload golden image failures
        # the actual and diff images of a failed screenshot test
        # (Debrief.Testing.GoldenImage)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-build
          path: org.mwc.debrief.lite/target/golden-failures/
          if-no-files-found: ignore

      - name: Save Maven / Tycho cache
        # Single writer, so PRs have one warm cache to restore from.
        if: always() && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.m2/repository
            ~/.p2
          key: m2-tycho-${{ hashFiles('org.mwc.debrief.targetplatforms/eclipse-latest.target', '**/pom.xml') }}

      # The MSI is only published on tag releases, so skip it elsewhere.
      # wixl comes from the signed Ubuntu archive (install-msitools.sh) rather
      # than being compiled from an unverified source tarball as root.
      - name: build installer
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ls org.mwc.debrief.product/target/products/
          ./install-msitools.sh
          ./contribs/msi/make_x64msi.sh
      - name: Check whether installer succeeded
        if: startsWith(github.ref, 'refs/tags/')
        uses: andstor/file-existence-action@v3
        with:
          files: "org.mwc.debrief.product/target/products/DebriefNG-Windows64Bit.msi"
          allow_failure: true

      - name: Derive artifact suffix
        id: meta
        if: always() && !startsWith(github.ref, 'refs/tags/')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # One artifact per platform, so a reviewer downloads ~250MB rather than
      # ~750MB. Uploaded even when the build step failed, because a failing test
      # should not deny a reviewer the binaries that were nonetheless produced.
      #
      # The product zips are uploaded as-is rather than unpacked first:
      # upload-artifact does not preserve the POSIX executable bit and flattens
      # symlinks, so an unpacked macOS .app or Linux tree would download broken.
      # archive: false stops upload-artifact wrapping each zip in a second zip,
      # so the reviewer downloads the platform zip itself. In that mode the
      # artifact takes the file's name (the `name` input is ignored), so the
      # zips are first linked under the short-SHA name the PR comment expects.
      - name: Stage review builds
        if: always() && !startsWith(github.ref, 'refs/tags/')
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          mkdir -p review-builds
          products=org.mwc.debrief.product/target/products
          for pair in Windows64Bit:Windows-x64 MacOSX64Bit:macOS-x64 Linux64Bit:Linux-x64; do
            src="${products}/DebriefNG-${pair%%:*}.zip"
            [ -f "$src" ] && ln -f "$src" "review-builds/DebriefNG-${pair##*:}-${SHA}.zip"
          done
          # Debrief Lite: one platform-neutral zip (debrief-lite-<version>.zip)
          for src in org.mwc.debrief.lite/dist/debrief-lite-*.zip; do
            [ -f "$src" ] && ln -f "$src" "review-builds/DebriefLite-${SHA}.zip"
          done
          ls -l review-builds
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        if: always() && !startsWith(github.ref, 'refs/tags/')
        with:
          path: review-builds/DebriefNG-Windows-x64-${{ steps.meta.outputs.sha }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: warn
      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        if: always() && !startsWith(github.ref, 'refs/tags/')
        with:
          path: review-builds/DebriefNG-macOS-x64-${{ steps.meta.outputs.sha }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        if: always() && !startsWith(github.ref, 'refs/tags/')
        with:
          path: review-builds/DebriefNG-Linux-x64-${{ steps.meta.outputs.sha }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Debrief Lite build
        uses: actions/upload-artifact@v7
        if: always() && !startsWith(github.ref, 'refs/tags/')
        with:
          path: review-builds/DebriefLite-${{ steps.meta.outputs.sha }}.zip
          archive: false
          retention-days: 7
          if-no-files-found: warn

      # Handoff to pr-build-comment.yml. github.event.workflow_run.pull_requests
      # is empty for fork PRs, so the PR number also travels via an artifact.
      # On a fork PR this file is attacker-writable, so pr-build-comment.yml
      # treats `pr` only as a lookup hint (it must match the run's head SHA) and
      # takes the build result from the run's conclusion, not from `build`.
      # Values go through `env:` rather than being interpolated into the script
      # body - on a fork PR these are attacker-influenced.
      - name: Record PR metadata
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p pr-meta
          printf 'pr=%s\nsha=%s\nbuild=%s\n' "$PR_NUMBER" "$HEAD_SHA" "$BUILD_OUTCOME" > pr-meta/meta.env
      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: pr-meta
          path: pr-meta/
          retention-days: 14
          if-no-files-found: error

      # Only a release-shaped tag (e.g. 20250307_3_1_44) publishes a release.
      # Scratch tags used to trigger a build must not ship one. Expressions have
      # no regex, so the match is made here and read back via the env context.
      - name: Identify release tags
        run: |
          if [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]{8}_[0-9]+(_[0-9]+)+$ ]]; then
            echo "IS_RELEASE_TAG=true" >> $GITHUB_ENV
          else
            echo "IS_RELEASE_TAG=false" >> $GITHUB_ENV
          fi
      - name: Upload  release
        uses: softprops/action-gh-release@v3
        if: env.IS_RELEASE_TAG == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: RELEASE_NOTES.md
          files: |
                 org.mwc.debrief.product/target/products/DebriefNG-Linux64Bit.zip
                 org.mwc.debrief.product/target/products/DebriefNG-MacOSX64Bit.zip
                 org.mwc.debrief.product/target/products/DebriefNG-Windows64Bit.zip
                 org.mwc.debrief.product/target/products/P2_Repository.zip
                 org.mwc.debrief.legacy/dist/DebriefLegacy*.jar
                 org.mwc.debrief.lite/dist/debrief-lite*.zip
                 org.mwc.debrief.product/target/products/DebriefNG-Windows64Bit.msi
      #make sure the xvfb windows that was opened is closed in the end
      - name: Cleanup xvfb pidx
        uses: bcomnes/cleanup-xvfb@v1

  # Debrief Lite's Swing UI tests take minutes and are prone to timing
  # failures under xvfb, so they run here, in parallel with the main build,
  # rather than inside it. A failure here fails the workflow: the job passed
  # 11 runs in a row before it was made required (debrief/debrief#5261).
  lite-ui-tests:
    name: Debrief Lite UI tests
    needs: changes
    # a UI test left waiting on a dialog would otherwise hold the runner for 6 hours
    timeout-minutes: 30
    if: needs.changes.outputs.software == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install xvfb
        run: sudo apt-get -y -o Acquire::Retries=3 update && sudo apt-get -y -o Acquire::Retries=3 install xvfb
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The first ./mvnw call downloads the pinned Maven from Central; the
      # wrapper does not retry, so a network blip would fail the whole job
      # Keep the pinned Maven itself, so most jobs don't download it at all
      - name: Cache the pinned Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-dist-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Fetch the pinned Maven
        run: |
          # Central's outages last a minute or two: back off 15, 30, 45, 60 s
          for n in 1 2 3 4 5; do
            ./mvnw --version && exit 0
            echo "::warning::[attempt ${n}/5] the Maven wrapper could not fetch Maven"
            [ "$n" = 5 ] || sleep $((15 * n))
          done
          echo "::error::the Maven wrapper could not fetch Maven after 5 attempts"
          exit 1
      - name: Restore Maven / Tycho cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.p2
          key: m2-tycho-${{ hashFiles('org.mwc.debrief.targetplatforms/eclipse-latest.target', '**/pom.xml') }}
          restore-keys: |
            m2-tycho-
      # Builds only Lite and the bundles it requires. They are listed by hand
      # because -am follows Maven dependencies, not OSGi Require-Bundle, and
      # misses the target definition and org.mwc.debrief.thirdparty (which
      # fetches the third-party jars) and org.mwc.cmap.geotools.libs (GeoTools) too. Keep this in step with
      # org.mwc.debrief.lite/META-INF/MANIFEST.MF. -DliteUiTests=true turns on
      # the Ant junit run in org.mwc.debrief.lite/build.xml.
      - name: Build Lite and run its UI tests
        # TEMPORARY: regenerate the golden images, to refresh lite-window/*.png
        env:
          DEBRIEF_GOLDEN_REGENERATE: 'true'
        run: >-
          xvfb-run -a ./mvnw -B verify -DliteUiTests=true -pl
          org.mwc.debrief.thirdparty,org.mwc.cmap.geotools.libs,org.mwc.debrief.targetplatforms,org.mwc.cmap.jfreechart,org.mwc.cmap.legacy,org.mwc.debrief.legacy,org.mwc.cmap.geotools,org.mwc.debrief.lite
      - name: Upload golden image failures
        # the actual and diff images of a failed screenshot test
        # (Debrief.Testing.GoldenImage)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-lite-ui
          path: org.mwc.debrief.lite/target/golden-failures/
          if-no-files-found: ignore

      - name: Upload regenerated lite-window images (TEMPORARY)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-lite-window
          path: org.mwc.debrief.legacy/test_data/golden/lite-window/
      - name: Upload Lite UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-ui-test-reports
          path: org.mwc.debrief.lite/temp.folder/reports/
          if-no-files-found: ignore

  # The Debrief NG UI tests (SWTBot, org.mwc.debrief.ui.test): the RCP product's
  # workbench, driven under xvfb. Separate from the main build, like Lite's UI
  # tests, while it proves stable. See docs/testing/rcp-ui-suite-plan.md.
  rcp-ui-tests:
    name: Debrief NG UI tests
    needs: changes
    # a UI test left waiting on a dialog would otherwise hold the runner for 6 hours
    timeout-minutes: 30
    if: needs.changes.outputs.software == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install xvfb
        run: sudo apt-get -y -o Acquire::Retries=3 update && sudo apt-get -y -o Acquire::Retries=3 install xvfb
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The first ./mvnw call downloads the pinned Maven from Central; the
      # wrapper does not retry, so a network blip would fail the whole job
      # Keep the pinned Maven itself, so most jobs don't download it at all
      - name: Cache the pinned Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-dist-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Fetch the pinned Maven
        run: |
          # Central's outages last a minute or two: back off 15, 30, 45, 60 s
          for n in 1 2 3 4 5; do
            ./mvnw --version && exit 0
            echo "::warning::[attempt ${n}/5] the Maven wrapper could not fetch Maven"
            [ "$n" = 5 ] || sleep $((15 * n))
          done
          echo "::error::the Maven wrapper could not fetch Maven after 5 attempts"
          exit 1
      - name: Restore Maven / Tycho cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.p2
          key: m2-tycho-${{ hashFiles('org.mwc.debrief.targetplatforms/eclipse-latest.target', '**/pom.xml') }}
          restore-keys: |
            m2-tycho-
      # The tests need every Debrief bundle (they run the whole product), so
      # build and install them first, without their unit tests (the main
      # build runs those), then run the UI test plugin against them.
      - name: Build Debrief NG
        run: ./mvnw -B install -DskipTests -pl '!org.mwc.debrief.product'
      - name: Run the Debrief NG UI tests
        run: >-
          xvfb-run -a -s "-screen 0 1600x1200x24" ./mvnw -B verify -DrcpUiTests=true
          -pl org.mwc.debrief.targetplatforms,org.mwc.debrief.ui.test
      - name: Upload Debrief NG UI test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rcp-ui-test-reports
          path: |
            org.mwc.debrief.ui.test/target/surefire-reports/
            org.mwc.debrief.ui.test/target/work/data/.metadata/.log
          if-no-files-found: ignore

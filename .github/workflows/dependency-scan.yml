# Dependency scan: an SBOM of the libraries committed to the repo, and a
# vulnerability report against it.
#
# Many of Debrief's third-party jars are committed, not managed by Maven, so
# nothing else watches them. Of those Maven fetches, Syft reads the
# org.mwc.debrief.thirdparty versions from its pom, and the GeoTools jars
# themselves, which this workflow fetches first. Syft identifies each jar (from the Maven metadata inside
# it, or failing that its manifest and file name) and native library; Grype
# matches them against known vulnerabilities.
#
# contribs/ is scanned and reported separately: it holds extras, not part of
# the shipped products.
#
# The scan never fails a build on findings. Instead, the weekly (and manual)
# run opens a GitHub issue, labelled dependency-vulnerability, for each new
# finding in the shipped products (.github/scripts/scan_issues.py). Pull
# request runs only report. Exceptions live in .github/grype.yaml.

name: Dependency scan

on:
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '37 5 * * 1'   # Mondays, 05:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a scanner upgrade shows up as its own change. Bump deliberately,
  # and note in the PR any change in the findings it causes.
  SYFT_VERSION: v1.57.1
  GRYPE_VERSION: v0.121.3
  GRYPE_CONFIG: .github/grype.yaml
  GRYPE_CHECK_FOR_APP_UPDATE: 'false'

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: SBOM and vulnerability report
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GeoTools and its ~100 runtime jars are fetched, not committed: fetch
      # them so Syft sees each jar (the pom lists only the direct modules).
      # Uses the runner's JDK 21 and a pinned Maven: the runner's own Maven
      # changes with the image, and 3.10.1 fails to resolve tycho-maven-plugin
      # (3.10.0 and 3.9.11 work).
      - name: Fetch the GeoTools jars
        env:
          MAVEN_VERSION: 3.9.11
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          base="https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries"
          file="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" "$base/$file"
          echo "$(curl -fsSL --retry 3 "$base/$file.sha512" | cut -d' ' -f1)  $RUNNER_TEMP/$file" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          mvn="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin/mvn"
          "$mvn" --version
          "$mvn" -B -ntp -pl org.mwc.cmap.geotools.libs generate-resources

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Build SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p scan
          # the shipped products: everything except the separately reported contribs/
          "$SYFT" scan dir:. \
            --exclude './.git/**' \
            --exclude './contribs/**' \
            --exclude './org.mwc.cmap.geotools.libs/**' \
            --source-name debrief --source-version "${GITHUB_SHA}" \
            -o syft-json=scan/sbom-debrief.syft.json \
            -o cyclonedx-json=scan/sbom-debrief.cdx.json
          "$SYFT" scan dir:./contribs \
            --source-name contribs -o syft-json=scan/sbom-contribs.syft.json

      - name: Scan for vulnerabilities
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          "$GRYPE" db update
          "$GRYPE" db status
          for part in debrief contribs; do
            "$GRYPE" "sbom:scan/sbom-${part}.syft.json" -c "$GRYPE_CONFIG" \
              -o "json=scan/grype-${part}.json" \
              -o "table=scan/grype-${part}.txt"
          done

      - name: Write the report
        run: |
          python3 .github/scripts/dependency_report.py --repo . \
            --sbom scan/sbom-debrief.syft.json --grype scan/grype-debrief.json \
            --inventory --title "Debrief and Debrief Lite" > scan/report.md
          python3 .github/scripts/dependency_report.py --repo . --brief \
            --sbom scan/sbom-contribs.syft.json --grype scan/grype-contribs.json \
            --title "Reported separately: contribs" >> scan/report.md
          # the job summary has a 1 MiB limit: leave out the full inventory there
          sed '/^### Inventory/,/^## /{/^## /!d}' scan/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOMs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan
          path: scan/
          retention-days: 90

  raise-issues:
    name: Open issues for new vulnerabilities
    needs: scan
    # the weekly and manual runs only: a pull request run reports, and its
    # token cannot write issues
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the scan
        uses: actions/download-artifact@v8.0.2
        with:
          name: dependency-scan
          path: scan

      - name: Open issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/scan_issues.py \
            --grype scan/grype-debrief.json --repo "${GITHUB_REPOSITORY}"

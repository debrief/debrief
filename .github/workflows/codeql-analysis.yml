# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ develop, master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ develop ]
  schedule:
    - cron: '21 17 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'javascript', 'python' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://git.io/codeql-language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild runs ./mvnw, which downloads the pinned Maven from Central and
    # doesn't retry: keep Maven in the cache and fetch it here with retries
    # first, as main.yml does, so a brief Central outage doesn't fail the scan
    - name: Cache the pinned Maven
      if: matrix.language == 'java'
      uses: actions/cache@v6
      with:
        path: ~/.m2/wrapper
        key: maven-dist-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
    - name: Fetch the pinned Maven
      if: matrix.language == 'java'
      run: |
        # Central's outages last a minute or two: back off 15, 30, 45, 60 s
        for n in 1 2 3 4 5; do
          ./mvnw --version && exit 0
          echo "::warning::[attempt ${n}/5] the Maven wrapper could not fetch Maven"
          [ "$n" = 5 ] || sleep $((15 * n))
        done
        echo "::error::the Maven wrapper could not fetch Maven after 5 attempts"
        exit 1

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

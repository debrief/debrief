# Dependabot keeps two things up to date. No PR is merged automatically:
# each one runs the full CI (build, Lite UI tests, golden files, scan).
#
# 1. The GitHub Actions used by the workflows.
# 2. The third-party jars that org.mwc.debrief.thirdparty fetches from Maven
#    Central into the plugins. Bumping a version there changes nothing else:
#    the jars keep their version-free file names. See
#    docs/dependencies/maven-jars.md.
#
# Jars that are still committed (no matching artifact on Central, and
# everything in org.mwc.cmap.geotools) are invisible to Dependabot.
# .github/workflows/dependency-scan.yml reports their vulnerabilities instead.
# See docs/dependencies/plan.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: /org.mwc.debrief.thirdparty
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # build plugins live in the parent pom, which
      # Dependabot reads through this module's <parent>: these are updated
      # by hand
      - dependency-name: "org.apache.maven.plugins:*"
      - dependency-name: "org.eclipse.tycho:*"
      # JFreeChart 1.5 moved org.jfree.ui into org.jfree.chart.ui and dropped
      # the *Base* renderer methods and jcommon: that is a code migration,
      # not a version bump
      - dependency-name: "org.jfree:jfreechart"
        versions: [">= 1.5"]
    # Jars that must move together share a group, majors included, so one PR
    # bumps the whole family. Dependabot uses the first group that matches.
    groups:
      poi:
        patterns: ["org.apache.poi:*", "org.apache.xmlbeans:*"]
      pdfbox:
        patterns: ["org.apache.pdfbox:*"]
      slf4j:
        patterns: ["org.slf4j:*"]
      jackson:
        patterns: ["com.fasterxml.jackson.core:*"]
      # the JUnit 6 jars (junit.version in the root pom) move together
      junit:
        patterns: ["org.junit.jupiter:*", "org.junit.platform:*", "org.opentest4j:*", "org.apiguardian:*"]
      # everything else: minor and patch bumps together, in one weekly PR.
      # Other major bumps arrive one per PR, because each can need code
      # changes.
      third-party-jars:
        update-types:
          - minor
          - patch
